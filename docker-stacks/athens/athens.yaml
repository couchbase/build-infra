version: '3.8'

# Suggested deployment command:
#   docker --host mega4.build.couchbase.com stack deploy --with-registry-auth -c athens.yaml athens
# All services, networks, etc. will then get an "athens_" prefix,
# eg. "athens_proxy"

services:
  proxy:
    deploy:
      placement:
        constraints:
          - node.labels.role==infrastructure
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_reverse-proxy"
        - "traefik.http.routers.athens.rule=Host(`goproxy.build.couchbase.com`)"
        - "traefik.http.services.athens_proxy.loadbalancer.server.port=3000"
    image: gomods/athens:v0.12.1
    init: true
    environment:
      - ATHENS_LOG_LEVEL=info
      - ATHENS_STORAGE_TYPE=disk
      - ATHENS_DISK_STORAGE_ROOT=/var/lib/athens
      # Athens' own internal `go mod download`/`go list` calls default to
      # GOPROXY=direct, ie. they clone straight from the VCS origin rather
      # than going through proxy.golang.org first. That means a module
      # whose origin tag changed after release (eg. a force-push) fails
      # Athens' own internal checksum-DB verification, even though the
      # original release content is still available, unmodified, from
      # proxy.golang.org's permanent cache. Routing through it first fixes
      # that without needing to disable verification.
      - ATHENS_GO_BINARY_ENV_VARS=GOPROXY=https://proxy.golang.org,direct
    volumes:
      - type: bind
        source: /buildteam/athens
        target: /var/lib/athens
    networks:
      - traefik_reverse-proxy

networks:
  traefik_reverse-proxy:
    external: true
