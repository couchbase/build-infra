---
# Before upgrading tonistiigi/binfmt version, make sure it is compatible with the OS and glibc.
# moby/buildkit image version in docker/buildslaves/util/hooks/buildx.sh should also be upgraded.
# If they are too far apart, it could lead to undesired build corruption.
- name: Create systemd service file for binfmt
  copy:
    dest: /etc/systemd/system/binfmt.service
    content: |
      [Unit]
      Description=Setup binfmt support for Docker buildx
      After=docker.service
      Requires=docker.service

      [Service]
      ExecStart=/usr/bin/docker run --rm --privileged tonistiigi/binfmt:qemu-v9.2.2 --install all

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Reload systemd
  systemd:
    daemon_reload: yes
  become: true

- name: Enable and start binfmt service
  systemd:
    name: binfmt.service
    enabled: yes
    state: started
  become: true
