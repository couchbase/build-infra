---
- name: Create systemd service file for binfmt
  copy:
    dest: /etc/systemd/system/binfmt.service
    content: |
      [Unit]
      Description=Setup binfmt support for Docker buildx
      After=docker.service
      Requires=docker.service

      [Service]
      ExecStart=/usr/bin/docker run --rm --privileged tonistiigi/binfmt:qemu-v8.1.5 --install all

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Reload systemd
  systemd:
    daemon_reload: yes
  become: true

- name: Enable and start binfmt service
  systemd:
    name: binfmt.service
    enabled: yes
    state: started
  become: true
